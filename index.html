<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список покупок</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    main { max-width: 450px; margin: auto; }
    h1 { font-size: 26px; }
    form { display: flex; flex-direction: column; gap: 8px; }
    input, button { font: inherit; padding: 8px; }
    ul { list-style: none; padding: 0; }
    li { margin: 10px 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script>
    const h = React.createElement;

    function ShoppingItem({ item, onRemove }) {
      return h('li', null,
        `${item.name} — ${item.price.toFixed(2)} ₽ `,
        h('button', { onClick: () => onRemove(item.id) }, 'Удалить')
      );
    }

    function App() {
      const [items, setItems] = React.useState([]);
      const [name, setName] = React.useState('');
      const [price, setPrice] = React.useState('');

      function addItem(event) {
        event.preventDefault();
        if (!name.trim()) return;
        setItems([...items, { id: crypto.randomUUID(), name: name.trim(), price: Number(price) }]);
        setName('');
        setPrice('');
      }

      function removeItem(id) {
        setItems(items.filter(item => item.id !== id));
      }

      const total = items.reduce((sum, item) => sum + item.price, 0);

      return h('main', null,
        h('h1', null, 'Список покупок'),
        h('form', { onSubmit: addItem },
          h('input', { placeholder: 'Название', 'aria-label': 'Название', required: true,
            value: name, onChange: event => setName(event.target.value) }),
          h('input', { type: 'number', placeholder: 'Цена', 'aria-label': 'Цена', min: 0, step: '0.01', required: true,
            value: price, onChange: event => setPrice(event.target.value) }),
          h('button', null, 'Добавить')
        ),
        h('ul', null, items.map(item => h(ShoppingItem, { key: item.id, item, onRemove: removeItem }))),
        h('p', null, `Итого: ${total.toFixed(2)} ₽`)
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
